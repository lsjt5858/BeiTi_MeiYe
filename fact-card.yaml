  # 课程信息来自2025课件，仅确认资料中的名称、大纲与标价，不认定现行班期/报价。
  - id: courses.catalog
    type: course
    status: confirmed
    value:
      nails:
        title: 美甲，从基础判断到完整作品
        intro: 先认识指甲结构和工具，再练前置、单色、建构与延长。款式完成后，用不同角度的作品记录复盘。
        reference:
          name: 新中式美甲基础强化课程
          duration: 4 天
          fee: 1980
          year: 2025
          source: 贝缇基础强化班2025，第14—15页
        modules:
          - name: 基础强化
            content: 甲型修形、俄式前置、单色与建构、纸托和光疗延长、浅贴甲片、作品创作与拍摄。
            topics:
              - 摸底测试：甲型修形、前置处理与单色
              - 俄式前置理论与实操，干式与湿式前置
              - 单色与建构，甲型弧度与光圈观察
              - 纸托选择、梯形与尖形光疗延长
              - 浅贴甲片的位置与塑形，杏仁形、椭圆形、方管形实操
              - 作品创作，单色与前置拍摄
            source: 贝缇基础强化班2025，第15页
          - name: 新中式前置处理
            content: 指甲结构、工具选择与养护、俄式前置的口袋区域、操作边界和常见问题。
            topics:
              - 指甲结构与前置处理的适用场景
              - 打磨机选择，打磨头使用与工具养护
              - 口袋区域认识与不推皮的处理技巧
              - 俄式小剪刀使用及操作注意事项
              - 藏起的死皮、倒刺与前置处理问题分析
            source: 贝缇基础强化班2025，第18—20页
          - name: 极致延长
            content: 甲型辨别、纸托定位、甲片与光疗延长、C弧与打磨顺序、贴合和气泡排错。
            topics:
              - 不同甲型辨别，鹰钩甲与上翘甲分析
              - 纸托定位与光疗胶选择
              - 日式无痕甲片与甲片延长
              - C弧打磨、打磨顺序与搓条使用
              - 贴片不牢、延长胶气泡及残甲修补问题
            source: 贝缇基础强化班2025，第21—23页
          - name: 极致单色
            content: 消毒流程、甲面观察、上色与包边、建构弧度、前后缘控制与拍摄。
            topics:
              - 消毒流程与指甲结构认识
              - 钢推、打磨头与死皮剪使用
              - 底胶涂抹、上色均匀与包边技巧
              - 甲面凹凸处理与建构弧度
              - 前后缘堆胶、持久度与光泽问题分析
              - 单色作品拍摄
            source: 贝缇基础强化班2025，第25—27页
          - name: 极致喷绘
            content: 喷枪使用、薄雾渐变、过渡观察与花卉表达。
            topics:
              - 喷枪使用
              - 薄雾感渐变与无痕过渡
              - 喷绘花卉表达
            source: 贝缇基础强化班2025，第28页
      lashes:
        title: 美睫，先看眼型，再谈款式
        intro: 认识毛型、翘度、工具与胶水，练持镊、取毛和贴合，再把轮廓、层次、眼型分析与真人实操接起来。
        modules:
          - name: 材料与工具
            content: 圆毛与扁毛、睫毛规格与翘度、镊子和胶水的认识。
            topics:
              - 原生睫毛的生长阶段与条件观察
              - 圆毛与扁毛，长度与粗度
              - J、B、C、D及L系列翘度
              - 镊子种类、产品功能与胶水认识
            source: 2025美睫全科班，第13、16—19页；中式美睫，第2页
          - name: 基础手法
            content: 持镊与支撑、取毛、润胶、直线练习、贴合面和连接状态观察。
            topics:
              - 两指与三指持镊，发力与支撑
              - 取毛、提毛与看毛角度
              - 润胶与贴合面观察
              - 直线与内扣直线练习
              - 上下服帖，A、B点与毛根连接
            source: 2025美睫全科班，第28—33页
          - name: 款式与层次
            content: 流苏、漫画、狐系与自然风格；分别观察框架、填充、毛向和色度。
            topics:
              - 外轮廓框架与内轮廓填充
              - 长短错落、层次穿插与毛向
              - 流苏、漫画柱体与狐系设计
              - 婴儿弯与自然风格
            source: 2025美睫全科班，第34—41页
          - name: 眼型与实操
            content: 眼型分析、个人风格讨论、真人实操和多角度作品记录。
            topics:
              - 睁眼平视观察，毛根翘度与毛尖高度
              - 结合眼型、妆造与个人风格设计
              - 真人实操流程与操作姿势
              - 正面睁眼、闭眼与侧面作品记录
            source: 2025美睫全科班，第22、42—44页；中式美睫，第2、28—30页
          - name: 中式款式分析
            content: 国风、漫画与多种定制款式的设计分析。
            topics:
              - 国风与漫画款式结构
              - 狐系、兔系、猫系、蛇系、蝶系与龙女款式分析
              - 款式复刻的观察要点
              - 下睫毛款式审美
            source: 中式美睫，第2、33—34、43—55页
          - name: 补睫与常见问题
            content: 补睫时机、嫁接后的连接与使用问题分析。
            topics:
              - 补睫时机与原生毛状态
              - 翘根、空心、歪斜与粘连问题
              - 根部发白与掉落问题分析
              - 嫁接后护理与常见问题
            source: 中式美睫，第2、56—67页；美睫教学PPT冷色调，第51—59页
      salon-management:
        title: 店务运营，把技术接到日常经营
        intro: 学习作品创作与拍摄、开店指导和门店营销。
        modules:
          - name: 作品表达
            content: 作品创作、毕业作品拍摄、单色与前置的拍照技巧。
            topics:
              - 毕业作品创作
              - 单色与前置作品拍摄
            source: 贝缇基础强化班2025，第15页
          - name: 开店与营销
            content: 开店指导课程，结合门店经营与营销背景讨论运营。
            topics:
              - 开店指导
              - 门店营销
            source: 贝缇基础强化班2025，第8、16页
    updated_at: '2026-11-22'

